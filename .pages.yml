media:
  input: media
  output: /media

content:
  - name: posts
    label: المقالات
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: عنوان المقال
        type: string
        required: true

      - name: date
        label: تاريخ النشر
        type: date

      - name: category
        label: التصنيف
        type: string

      - name: excerpt
        label: ملخص المقال
        type: text

      - name: cover
        label: صورة المقال
        type: image

      - name: published
        label: منشور
        type: boolean

      - name: body
        label: محتوى المقال
        type: rich-text
